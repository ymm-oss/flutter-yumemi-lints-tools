name: Setup
description: Set up the project

runs:
  using: "composite"
  steps:
    - name: Set up Dart
      uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      env:
        # https://mise.jdx.dev/configuration/settings.html#locked
        MISE_LOCKED: "1"
        # https://mise.jdx.dev/configuration/settings.html#safe
        MISE_SAFE: "1"

    - name: Get dependencies
      run: dart pub get
      shell: bash

    - name: Set up melos
      run: |
        MELOS_VERSION=$(cat pubspec.lock | yq ".packages.melos.version" -r)
        dart pub global activate melos $MELOS_VERSION
        # mise-action does not add the pub global bin directory that setup-dart added.
        # GITHUB_PATH applies to later steps; export applies to melos bootstrap below.
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.pub-cache/bin:$PATH"
        melos bootstrap
      shell: bash
